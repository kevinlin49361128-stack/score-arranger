<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy — 防止第三方域名被 takeover 後注入 JS.
         connect-src 白名單:
           - 'self' / file: → 本地 (Vite dev / 打包後 file://)
           - tonejs / nbrosowsky / gleitz → SoundFont sample 來源 (硬編 https)
           - api.anthropic.com / api.openai.com → LLM provider
           - http://localhost:* → 自架 Ollama / OpenAI-compat endpoint
         script-src 'wasm-unsafe-eval' — verovio + 部分 Tone.js 內部需要 WASM.
         worker-src 'self' blob: — Tone.js 15+ 的 AudioWorklet 從 blob 載入,
                                    沒這條會直接無聲 (worklet 載不進去).
         style 用 'unsafe-inline' 是 React/CSS-in-JS 必需 (component 內 style 屬性). -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: 'wasm-unsafe-eval'; worker-src 'self' file: blob:; child-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: blob: https://tonejs.github.io https://nbrosowsky.github.io https://gleitz.github.io; connect-src 'self' file: https://tonejs.github.io https://nbrosowsky.github.io https://gleitz.github.io https://api.anthropic.com https://api.openai.com http://localhost:* http://127.0.0.1:*; font-src 'self' file: data:; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <title>Score Arranger</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC",
          "Microsoft JhengHei", Arial, sans-serif;

        /* === Light theme (預設) === */
        --bg-base: #f5f5f7;
        --bg-panel: #ffffff;
        --bg-panel-translucent: rgba(255, 255, 255, 0.9);
        --bg-secondary: #fafafa;
        --bg-tertiary: #f0f0f0;
        --bg-hover: #faf6ec;
        --bg-divider: #ddd;

        --fg-primary: #1d1d1f;
        --fg-secondary: #444;
        --fg-muted: #666;
        --fg-tertiary: #999;

        --border: #ddd;
        --border-light: #eee;
        --border-strong: #ccc;

        --accent: #8c6210;
        --accent-fg: #ffffff;
        --accent-hover: #73500d;

        --error-bg: #ffebee;
        --error-fg: #c62828;
        --error-border: #ef9a9a;

        --warning-fg: #f57c00;
        --success-fg: #388e3c;

        --info-bg: #e3f2fd;
        --info-fg: #1565c0;
        --info-border: #90caf9;

        --button-bg: #ffffff;
        --button-fg: #1d1d1f;
        --button-border: #ccc;
        --button-bg-hover: #f5f5f5;

        --code-bg: rgba(0, 0, 0, 0.05);

        --scrollbar-thumb: rgba(40, 32, 16, 0.22);
        --scrollbar-thumb-hover: rgba(140, 98, 16, 0.65);

        /* === premium 質感 token (0.1.90 UI 升級) — 玻璃 / 立體層次 / 彈性緩動 === */
        --glass-bg: rgba(255, 255, 255, 0.68);
        --glass-border: rgba(140, 98, 16, 0.16);
        --elev-1: 0 1px 2px rgba(0,0,0,.08), 0 0 0 .5px rgba(140,98,16,.05);
        --elev-2: 0 6px 22px rgba(60,45,15,.14), 0 0 0 .5px rgba(140,98,16,.08);
        --elev-3: 0 18px 50px rgba(60,45,15,.20), 0 0 0 .5px rgba(140,98,16,.10);
        /* 緩動 + 圓角 scale (與主題無關, 定義一次即繼承) */
        --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --r-s: 8px;
        --r-m: 12px;
        --r-l: 18px;
        /* Dorico 靈感 A4: 間距節奏 (8px 網格) + 字級階層 — 與主題無關.
           漸進採用: 新/改的元件用這些 token, 取代散落的魔術數字. */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 24px;
        --fs-xs: 11px;
        --fs-sm: 12px;
        --fs-base: 13px;
        --fs-md: 15px;
        --fs-lg: 18px;
        --fs-xl: 22px;
      }

      body.dark {
        /* === Dark theme === */
        --bg-base: #1c1c1e;
        --bg-panel: #2c2c2e;
        --bg-panel-translucent: rgba(44, 44, 46, 0.92);
        --bg-secondary: #3a3a3c;
        --bg-tertiary: #2c2c2e;
        --bg-hover: #3a352b;
        --bg-divider: #444;

        --fg-primary: #f5f5f7;
        --fg-secondary: #d0d0d2;
        --fg-muted: #a0a0a3;
        --fg-tertiary: #7a7a7d;

        --border: #444;
        --border-light: #333;
        --border-strong: #555;

        --accent: #d9aa63;
        --accent-fg: #1a1510;
        --accent-hover: #ecc890;

        --error-bg: #4a1c20;
        --error-fg: #ff8a80;
        --error-border: #8a3a40;

        --warning-fg: #ffb74d;
        --success-fg: #81c784;

        --info-bg: #1a3a5c;
        --info-fg: #8ab8e8;
        --info-border: #3a5a8c;

        --button-bg: #3a3a3c;
        --button-fg: #f5f5f7;
        --button-border: #555;
        --button-bg-hover: #4a4a4c;

        --code-bg: rgba(255, 255, 255, 0.08);

        --scrollbar-thumb: rgba(236, 230, 218, 0.17);
        --scrollbar-thumb-hover: rgba(217, 170, 99, 0.6);

        /* premium 質感 token — dark 版玻璃 + 暖金光邊立體層次 */
        --glass-bg: rgba(40, 36, 28, 0.62);
        --glass-border: rgba(217, 170, 99, 0.18);
        --elev-1: 0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(217,170,99,.06);
        --elev-2: 0 6px 22px rgba(0,0,0,.42), 0 0 0 .5px rgba(217,170,99,.1);
        --elev-3: 0 18px 50px rgba(0,0,0,.55), 0 0 0 .5px rgba(217,170,99,.14);
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg-base);
        color: var(--fg-primary);
        transition: background-color 0.15s ease, color 0.15s ease;
      }

      /* === 捲動軸 — 配合深色 / 金色主題 === */
      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 6px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* OSMD 內容容器一律保持淺色 (避免重新渲染), 透過 wrapper 控制 */
      .osmd-light-wrapper {
        background: #ffffff;
        color: #000000;
      }

      /* 點 Issue 後譜面 flash 動畫: 黃色脈動 → 淡出 */
      @keyframes score-flash {
        0% {
          background: rgba(255, 215, 0, 0.55);
          box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.7);
        }
        40% {
          background: rgba(255, 215, 0, 0.35);
          box-shadow: 0 0 0 2px rgba(255, 165, 0, 0.5);
        }
        100% {
          background: rgba(255, 215, 0, 0);
          box-shadow: 0 0 0 0 rgba(255, 165, 0, 0);
        }
      }
      .score-flash-overlay {
        animation: score-flash 1.5s ease-out forwards;
      }

      /* 播放游標: 半透明綠色小節高亮, 平順滑動跟隨 (取代被深色背景蓋掉的
         OSMD 內建 cursor)。transition 讓游標在小節間平順滑過, 不瞬間跳。 */
      .score-playback-cursor {
        background: rgba(52, 199, 89, 0.13);
        border-radius: 4px;
        transition:
          left 130ms ease-out,
          top 130ms ease-out,
          width 130ms ease-out,
          height 130ms ease-out;
        animation: fx-cursor-pulse 1.7s ease-in-out infinite;
      }
      /* 播放游標微脈動 — 柔光呼吸, 取代原本的硬框 */
      @keyframes fx-cursor-pulse {
        0%, 100% {
          box-shadow:
            0 0 0 1.5px rgba(52, 199, 89, 0.55) inset,
            0 0 7px 0 rgba(52, 199, 89, 0.18);
        }
        50% {
          box-shadow:
            0 0 0 2px rgba(52, 199, 89, 0.82) inset,
            0 0 13px 2px rgba(52, 199, 89, 0.34);
        }
      }

      /* 0.1.46 視覺升級 B2 — 播放音符 ripple 漸散光暈.
         每次進入新小節, 從小節中心向外擴散 0.6s, 強化「呼吸感」.
         取代純脈動的視覺等待感, 給古典樂客群更貼近演奏的感受. */
      @keyframes score-ripple {
        0% {
          opacity: 0.45;
          transform: scale(0.85);
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      .score-playback-ripple {
        position: absolute;
        pointer-events: none;
        border-radius: 6px;
        border: 2px solid rgba(52, 199, 89, 0.62);
        transform-origin: center;
        animation: score-ripple 0.6s ease-out forwards;
      }

      /* 持久「選取小節」高亮: 點 issue / 點小節後留著的琥珀色外框 */
      .score-selected-measure {
        background: rgba(255, 179, 0, 0.12);
        box-shadow: 0 0 0 2px rgba(255, 179, 0, 0.9) inset;
        border-radius: 4px;
      }

      /* 載入遮罩的轉圈動畫 */
      @keyframes score-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── 視覺特效 ── */

      /* 啟動淡入: app 開啟時整體柔和淡入 */
      @keyframes app-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      #root {
        animation: app-fade-in 0.35s ease-out;
      }

      /* 對話框動態: 淡入 + 輕微放大 (背景遮罩同步淡入) */
      @keyframes fx-modal-in {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes fx-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .fx-modal-card {
        animation: fx-modal-in 0.15s ease-out;
      }
      .fx-modal-backdrop {
        animation: fx-backdrop-in 0.15s ease-out;
      }

      /* 改編完成揭示: 目標譜由無→有時淡入 + 微微上滑 */
      @keyframes fx-reveal {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fx-reveal {
        animation: fx-reveal 0.34s ease-out;
      }

      /* 0.1.45 視覺升級 B3 — source↔target 切換 crossfade.
         譜面換新內容時 (不是由無變有, 而是由 A 變 B), 整個容器先半透
         明再淡回, 取代瞬間切換, 給古典樂客群更 ceremonious 的感覺. */
      @keyframes fx-crossfade {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
      .fx-crossfade {
        animation: fx-crossfade 0.3s ease-out;
      }

      /* 套用成功微回饋: 按鈕一個輕脈動 */
      @keyframes fx-pulse {
        0%, 100% { transform: scale(1); }
        45% { transform: scale(1.06); }
      }
      .fx-pulse {
        animation: fx-pulse 0.4s ease-out;
      }

      /* Coachmark 引導模式 — anchor 元素持續脈動, 引導使用者注意 */
      @keyframes coachmark-pulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(217, 170, 99, 0.5);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(217, 170, 99, 0);
        }
      }
      .coachmark-pulse {
        animation: coachmark-pulse 1.6s ease-out infinite;
        position: relative;
        z-index: 1;
      }

      /* 歡迎空狀態的譜號意象 — 極緩呼吸浮動 */
      @keyframes fx-breathe {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
        50% { transform: translateY(-5px) scale(1.03); opacity: 0.56; }
      }
      .fx-breathe {
        animation: fx-breathe 4.5s ease-in-out infinite;
      }

      /* 漸進式改編 — 背景精修中的脈動點 */
      @keyframes sa-refining-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .sa-refining-dot {
        display: inline-block;
        animation: sa-refining-pulse 1.1s ease-in-out infinite;
      }

      /* === 0.1.90 premium glass surface — 浮動面玻璃質感 ===
         套在任何浮動容器 (popover / 對話框 / 浮層): 真 backdrop blur +
         主題感知半透明底 + 暖金細邊 + 統一立體層次。記得別在 inline style
         再設 background/border/box-shadow (會蓋掉本 class)。 */
      .sa-glass {
        background: var(--glass-bg);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid var(--glass-border);
        box-shadow: var(--elev-2);
      }
      /* hover 微浮起 — 彈性緩動帶來的高級觸感 */
      .sa-lift {
        transition: transform .16s var(--ease-spring), box-shadow .16s var(--ease-smooth);
      }
      .sa-lift:hover { transform: translateY(-1px); box-shadow: var(--elev-2); }

      /* popover 進場: 自錨點輕彈出 (搭 --ease-spring) */
      @keyframes popin {
        from { opacity: 0; transform: translateY(6px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* === 0.1.90 micro-interaction — 全域按鈕「按下去」觸感 ===
         只在 :active 給細微回彈縮放, 不碰 layout / hover bg。有自家動畫的
         按鈕 (fx-pulse) 動畫優先, 不衝突。讓每次點擊都有實體感。 */
      button { transition: transform .12s var(--ease-spring); }
      button:not(:disabled):active { transform: scale(0.965); }

      /* === 0.1.90 S3: 方向性修復 ghost — 移八度後 ↑/↓ 自小節升/降淡出 ===
         輕量版「音符移位」暗示: 不追真實音符座標, 只給方向感。 */
      @keyframes fx-fixghost-up {
        0%   { opacity: 0; transform: translateY(8px) scale(0.7); }
        30%  { opacity: 1; }
        100% { opacity: 0; transform: translateY(-22px) scale(1.05); }
      }
      @keyframes fx-fixghost-down {
        0%   { opacity: 0; transform: translateY(-8px) scale(0.7); }
        30%  { opacity: 1; }
        100% { opacity: 0; transform: translateY(22px) scale(1.05); }
      }
      .fx-fixghost-up { animation: fx-fixghost-up 0.85s var(--ease-smooth) forwards; }
      .fx-fixghost-down { animation: fx-fixghost-down 0.85s var(--ease-smooth) forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
